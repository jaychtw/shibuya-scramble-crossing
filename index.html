<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shibuya Scramble Crossing</title><style>*{box-sizing:border-box}body{margin:0;background:#101726;color:#fff6e6;font:14px system-ui}canvas{position:absolute;inset:0;width:100%;height:100dvh;touch-action:none;background:#151f30 url(crossing.webp) center/cover;cursor:crosshair}header,footer{position:absolute;left:0;width:100%;padding:clamp(18px,3vw,48px);pointer-events:none;text-shadow:0 2px 8px #000}header{top:0;background:linear-gradient(#060c16be,transparent)}h1{font:italic 700 clamp(30px,4vw,62px)/.98 Georgia,serif;letter-spacing:-.055em;margin:8px 0}small{font:600 11px system-ui;letter-spacing:.24em;color:#ffd7a8}footer{bottom:0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,#060c16c9);gap:20px}button{pointer-events:auto;background:#101a23ce;border:1px solid #ffffff77;border-radius:30px;padding:10px 17px;color:inherit;cursor:pointer}</style><canvas tabindex="0" aria-label="Shibuya crossing. Click or tap a destination, or use arrow keys to steer."></canvas><header><small>東京　／　渋谷</small><h1>Shibuya Scramble<br>Crossing</h1></header><footer><span>Tap the road to drive</span><button>Pause</button></footer><script src="sim.js"></script><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),bg=new Image(),btn=document.querySelector('button');bg.src='crossing.webp';let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,prev=0,time=0,scale=1,ox=0,oy=0,trail=[];
function view(){const w=c.clientWidth,h=c.clientHeight,d=Math.min(2,devicePixelRatio);if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}scale=Math.max(w/800,h/450);ox=Math.max(w-800*scale,Math.min(0,w/2-car.x*scale));oy=Math.max(h-450*scale,Math.min(0,h/2-car.y*scale));g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}
function shape(d,color){g.fillStyle=color;g.fill(new Path2D(d))}
function coupe(){g.save();g.translate(car.x,car.y);g.rotate(car.a);g.shadowColor='#070910';g.shadowBlur=3;g.shadowOffsetY=2;shape('M-12 -4 Q-11 -6 -7 -6 L7 -5.5 Q13 -5 13 0 Q13 5 8 5.5 L-8 6 Q-12 6 -12 4Z','#bd4012');g.shadowBlur=0;g.shadowOffsetY=0;let paint=g.createLinearGradient(0,-6,0,6);paint.addColorStop(0,'#ffe4a7');paint.addColorStop(.22,'#ff972c');paint.addColorStop(.7,'#eb6719');paint.addColorStop(1,'#853622');shape('M-11 -4 Q-9 -5 -5 -5 L8 -4.8 Q12 -4 12 0 Q12 4 8 4.8 L-9 5 Q-11 4 -11 3Z',paint);shape('M-7 -3.7L-3 -4.3 3 -4 6 -2.9 6 2.9 3 4 -3 4.3 -7 3.7Z','#23384b');shape('M-3 -3.5 L1 -3.4 2 3.4 -3 3.5Z',paint);g.fillStyle='#fff3bf';g.fillRect(10,-4,.9,2);g.fillRect(10,2,.9,2);g.fillStyle='#141c26';g.fillRect(-10,-5,1.4,10);g.fillStyle='#ff4d54';g.fillRect(-11,-4,.8,2);g.fillRect(-11,2,.8,2);g.restore()}
function refresh(){btn.textContent=paused?'Resume':'Pause'}refresh();btn.onclick=()=>{paused=!paused;refresh()};function drive(x,y){paused=false;refresh();steer(x,y)}
c.onpointerdown=e=>{c.focus({preventScroll:true});drive((e.clientX-ox)/scale,(e.clientY-oy)/scale)};c.onkeydown=e=>{const dirs={ArrowRight:[60,0],ArrowLeft:[-60,0],ArrowUp:[0,-60],ArrowDown:[0,60]};if(dirs[e.key]){e.preventDefault();let [x,y]=dirs[e.key];drive(car.x+x,car.y+y)}};
function frame(now){let dt=Math.min(.05,(now-prev)/1000);prev=now;if(!paused){time+=dt;for(let i=0;i<3;i++)step(dt/3);if(car.v>6&&(!trail.length||dist(trail.at(-1),car)>2))trail.push({x:car.x,y:car.y,a:car.a,t:time});trail=trail.filter(p=>time-p.t<2.4)}view();if(bg.naturalWidth)g.drawImage(bg,0,0,800,450);
for(let p of trail){g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle='rgba(24,21,33,'+(.23*(1-(time-p.t)/2.4))+')';g.fillRect(-9,-4,4,1);g.fillRect(-9,3,4,1);g.restore()}
if(goal){g.strokeStyle='#ffd298cc';g.lineWidth=.75;g.beginPath();g.ellipse(goal.x,goal.y,5,4,0,0,7);g.stroke()}
for(let p of people){g.fillStyle='#111923a8';g.beginPath();g.ellipse(p.x+1,p.y+1.5,2.6,1.4,-.3,0,7);g.fill();g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,1.9,0,7);g.fill()}coupe();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
